<meta name="description" content="Tu calendario con IA: organiza tu día, te avisa antes y te recuerda los cumpleaños.">

<script>
// Theme before first paint: the setting (Sistema / Claro / Oscuro) or, for Sistema, the device's mode.
(function () {
  var t = "system"; try { t = (JSON.parse(localStorage.getItem("settings")) || {}).theme || "system"; } catch (e) {}
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector("#themeColor").content = dark ? "#0D0D12" : "#FFFBEA";
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Identity: Pendi, sticky-note style (cream ground, yellow accent, ink outlines), dressed like Penumbra Visuals at night (near-black, glowing yellow pills, condensed uppercase titles). Layout: A large-title day list with a week strip; assistant panes on the right (tab bar on phones). */
:root {
  --bg: #FFFBEA; --group: #FFF4CC; --cell: #ffffff; --ink: #1E1E1E; --muted: #5F5B4E; --sep: rgba(30, 30, 30, .14);
  --accent: #F2C744; --accent-ink: #14141A; --accent-text: #1E1E1E; --line: #1E1E1E; --edge: #1E1E1E; --red: #E5484D; --focus: #1E1E1E; --fill: rgba(30, 30, 30, .07);
  --c-trabajo: #3E8EDE; --c-personal: #9B6BDF; --c-casa: #22A699; --c-salud: #2FA84F; --c-creativo: #F08A24; --c-social: #FF6F91; --c-otro: #8C877A;
  --banner: rgba(255, 251, 234, .9); --shadow: 4px 4px 0 var(--line); --glow: 0 8px 22px rgba(242, 199, 68, .55);
  --font: "Archivo", system-ui, "Segoe UI", sans-serif;
  --display: "Anton", "Archivo", Impact, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0D0D12; --group: #0D0D12; --cell: #17171F; --ink: #F5F5F2; --muted: #A3A3AD; --sep: rgba(255, 255, 255, .1);
  --accent: #F2C744; --accent-ink: #14141A; --accent-text: #F2C744; --line: #F2C744; --edge: rgba(255, 255, 255, .1); --red: #FF6B6B; --focus: #F2C744; --fill: rgba(255, 255, 255, .08);
  --c-trabajo: #6CB4FF; --c-personal: #C39BFF; --c-casa: #4FD1C1; --c-salud: #5BD47A; --c-creativo: #FFA552; --c-social: #FF8FAB; --c-otro: #A7A08A;
  --banner: rgba(23, 23, 31, .92); --shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 10px 40px rgba(0, 0, 0, .6); --glow: 0 8px 26px rgba(242, 199, 68, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 400px; padding-top: env(safe-area-inset-top, 0px); }
.cal { min-width: 0; min-height: 0; overflow-y: auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); }
.cal-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 18px; }
.side { background: var(--group); border-left: 1px solid var(--sep); min-height: 0; display: grid; grid-template-rows: auto 1fr; }

.top { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.link { border: 0; background: transparent; color: var(--accent-text); font-size: 17px; padding: 6px 4px; cursor: pointer; }
.chev { border: 0; background: transparent; color: var(--accent-text); width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.chev:hover, .link:hover { opacity: .7; }
.spacer { flex: 1; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h1 { font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; margin: 2px 0 0; text-wrap: balance; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wd { border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center; gap: 4px; padding: 4px 0; }
.wd .l { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.wd .n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-size: 18px; font-variant-numeric: tabular-nums; }
.wd .m { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: 0; }
.wd .m.on { opacity: .6; }
.wd.today .n { box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; }
.wd[aria-pressed="true"] .n { background: var(--ink); color: var(--bg); font-weight: 600; }
.wd.today[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }

.list { background: var(--cell); border-radius: 14px; overflow: hidden; }
:root[data-theme="light"] .list { box-shadow: 0 0 0 1px var(--sep); }
.item { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; display: grid; grid-template-columns: 74px 3px minmax(0, 1fr); gap: 12px; padding: 12px 16px; align-items: stretch; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 105px; right: 0; height: 1px; background: var(--sep); }
.item:hover { background: var(--fill); }
.item .t { font-variant-numeric: tabular-nums; font-size: 15px; display: grid; align-content: start; }
.item .t small { color: var(--muted); font-size: 13px; }
.item .bar { border-radius: 2px; background: var(--c); }
.item .ti { font-weight: 600; font-size: 16px; }
.item .tip { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item.done .ti { text-decoration: line-through; color: var(--muted); }
.item.example .ti::after { content: attr(data-example); color: var(--muted); font-weight: 400; }
.item.now { background: color-mix(in srgb, var(--accent) 22%, var(--cell)); }
.empty { text-align: center; color: var(--muted); padding: 36px 16px; display: grid; gap: 10px; justify-items: center; }
.section-label { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 0 16px -10px; }

/* panes */
.tabs { display: flex; gap: 4px; padding: 12px 16px 0; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--cell); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.pane { overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; min-height: 0; }
.pane h2 { margin: 6px 0 0; font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.pane h3.sub { margin: 8px 0 -6px 16px; font-size: 13px; text-transform: uppercase; color: var(--muted); font-weight: 400; letter-spacing: .03em; }
.muted { color: var(--muted); font-size: 14px; }
.field { width: 100%; border: 0; background: var(--cell); border-radius: 12px; padding: 12px 14px; min-width: 0; }
textarea.field { min-height: 130px; resize: vertical; line-height: 1.45; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 0; background: var(--fill); color: var(--accent-text); border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 6px 14px; font-size: 14px; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:active { transform: scale(.98); }
.card { background: var(--cell); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.card h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--fill); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lvcards { display: grid; gap: 10px; }
.lvcard { text-align: left; border: 2px solid var(--sep); background: var(--fill); color: var(--ink); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; cursor: pointer; font: inherit; }
.lvcard b { font-size: 16px; } .lvcard .d { font-size: 14px; color: var(--muted); line-height: 1.35; } .lvcard .n { font-size: 13px; font-weight: 700; }
.lvcard[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 4px 14px rgba(242, 199, 68, .35); }
.lvcard[aria-checked="true"] b::after { content: " ✓"; color: var(--accent-text); }
.chip.rec:not([aria-pressed="true"]) { box-shadow: inset 0 0 0 2px var(--line); }
.tipbox { background: var(--group); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
:root[data-theme="dark"] .tipbox { background: rgba(255, 255, 255, .06); }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--red); }
.chatlog { display: grid; gap: 6px; }
.msg { border-radius: 18px; padding: 8px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; }
.msg.ai { background: var(--cell); justify-self: start; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.check .ok { color: var(--c-salud); font-weight: 700; }
.check .no { color: var(--red); font-weight: 700; }
code.key { display: block; font-size: 12px; word-break: break-all; background: var(--group); border-radius: 8px; padding: 6px 8px; user-select: all; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle input[type="checkbox"] { width: 46px; height: 28px; appearance: none; background: var(--fill); border-radius: 999px; position: relative; cursor: pointer; transition: background .2s; flex: none; }
.toggle input[type="checkbox"]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.toggle input[type="checkbox"]:checked { background: var(--c-salud); }
.toggle input[type="checkbox"]:checked::after { transform: translateX(18px); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 30; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--cell); border-radius: 22px; box-shadow: var(--shadow); width: min(460px, 100%); padding: 10px 20px 20px; display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); justify-self: center; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 24px; letter-spacing: -0.02em; }
.sheet .when { color: var(--muted); }
.sheet .actions { display: grid; gap: 1px; background: var(--sep); border-radius: 12px; overflow: hidden; }
.sheet .actions > * { background: var(--group); border: 0; padding: 13px 16px; text-align: left; font-size: 16px; color: var(--accent-text); cursor: pointer; text-decoration: none; }
:root[data-theme="dark"] .sheet .actions > * { background: #2c2c2e; }
.sheet .actions .danger { color: var(--red); }

/* iOS-style notification banner */
.toasts { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 8px; width: min(400px, calc(100vw - 16px)); z-index: 40; }
.toast { background: var(--banner); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); color: var(--ink); border-radius: 22px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.toast img { width: 38px; height: 38px; border-radius: 9px; }
.toast .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.toast b { display: block; font-size: 15px; }
.toast p { margin: 1px 0 0; font-size: 15px; line-height: 1.3; }
.toast { position: relative; overflow: hidden; }
.toast .acts { grid-column: 1 / -1; display: flex; gap: 6px; }
.toast .acts button { flex: 1; border: 0; background: var(--fill); color: var(--accent-text); border-radius: 12px; padding: 8px 4px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.toast .life { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); opacity: .55; transform-origin: left; animation: life var(--life, 10s) linear forwards; }
.toast.hold .life { animation-play-state: paused; }
@keyframes life { to { transform: scaleX(0); } }
.mic { border: 0; background: var(--fill); color: var(--accent-text); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
.mic.rec { background: var(--red); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .mic.rec { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--red) 25%, transparent); } } }
.msg.ai { white-space: normal; }
.msg.ai p { margin: 0 0 6px; }
.msg.ai ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.msg.ai li { padding-left: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: drop .45s cubic-bezier(.2, .9, .25, 1.15); }
  @keyframes drop { from { transform: translateY(-120%); opacity: .2; } }
}

/* gate */
.gate { min-height: 100%; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-left, 0px)); background: var(--group); }
.gate .card { width: min(400px, 100%); padding: 24px; gap: 14px; text-align: center; justify-items: center; }
.gate .card .field { background: var(--group); text-align: center; }
.gate img { width: 72px; height: 72px; border-radius: 16px; }

/* phones */
.tabbar { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  .side { border-left: 0; position: fixed; inset: env(safe-area-inset-top, 0px) 0 calc(56px + env(safe-area-inset-bottom, 0px)) 0; z-index: 20; grid-template-rows: 1fr; }
  .side .tabs { display: none; }
  .pane { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 88px max(16px, env(safe-area-inset-left, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--banner); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; }
  .tabbar button { border: 0; background: transparent; padding: 6px 0 4px; font-size: 10px; font-weight: 500; color: var(--muted); display: grid; justify-items: center; gap: 1px; cursor: pointer; }
  .tabbar button[aria-selected="true"] { color: var(--accent-text); }
  .sheet-bg { place-items: end center; padding: 0; }
  .sheet { border-radius: 22px 22px 0 0; width: 100%; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .3s cubic-bezier(.2, .9, .3, 1); } @keyframes up { from { transform: translateY(100%); } } }
}

/* day summary, now line, swipe */
.summary { color: var(--muted); font-size: 15px; margin-top: 4px; }
.summary b { color: var(--ink); font-weight: 600; }
/* "Now" marker: a labelled yellow pill followed by a line, so it reads as the current time and not as a missing task. */
.nowline { display: flex; align-items: center; gap: 8px; padding: 8px 16px; }
.nowline span { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowline::after { content: ""; flex: 1; height: 2px; border-radius: 1px; background: var(--accent); }
.swipe { position: relative; overflow: hidden; }
.swipe .under { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-weight: 600; color: #fff; }
.swipe .under .l { opacity: 0; } .swipe .under .r { opacity: 0; }
.swipe.go-done .under { background: var(--c-salud); } .swipe.go-done .under .l { opacity: 1; }
.swipe.go-later .under { background: var(--c-creativo); } .swipe.go-later .under .r { opacity: 1; }
.swipe .item { background: var(--cell); touch-action: pan-y; transition: transform .2s; }
.swipe.dragging .item { transition: none; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }

/* month view */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.month .wd .n { width: 34px; height: 34px; font-size: 16px; }
.month .wd.out .n { color: var(--muted); opacity: .45; }
.dots { display: flex; gap: 2px; height: 5px; justify-content: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }

/* floating add */
.fab { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 24px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); display: grid; place-items: center; cursor: pointer; z-index: 26; }
.fab svg { width: 28px; height: 28px; stroke-width: 2.2; }
@media (min-width: 861px) { .fab { right: calc(400px + 24px); } }
@media (max-width: 860px) { .fab { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); } }

/* organize */
.bigmic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; justify-self: center; box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 35%, transparent); }
.bigmic svg { width: 40px; height: 40px; }
.bigmic.rec { background: var(--red); }
@media (prefers-reduced-motion: no-preference) { .bigmic.rec { animation: pulse 1.2s ease-in-out infinite; } }
.miclabel { text-align: center; color: var(--muted); font-size: 14px; margin-top: -6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* custom date field: shows our format, opens the native picker */
.datef { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 999px; padding: 7px 14px; font-size: 15px; cursor: pointer; }
.datef input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; }
.datef.on { background: var(--accent); color: var(--accent-ink); }
.datef.block { border-radius: 12px; background: var(--cell); padding: 12px 14px; display: flex; }
.datef .ph { color: var(--muted); }

/* chat */
[data-pane="chat"]:not([hidden]) { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-auto-rows: auto; padding-bottom: 0; overflow: hidden; }
[data-pane="chat"] .chatscroll { overflow-y: auto; min-height: 0; display: grid; align-content: start; gap: 10px; padding-bottom: 8px; }
[data-pane="chat"] form { position: sticky; bottom: 0; background: var(--group); padding: 8px 0 12px; flex-wrap: nowrap; }
.speak { border: 0; background: transparent; color: var(--accent-text); font-size: 13px; font-weight: 600; padding: 2px 0 0; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.speak svg { width: 16px; height: 16px; }

/* birthdays */
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.addbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--accent-text); display: grid; place-items: center; cursor: pointer; flex: none; }
.addbtn svg { width: 20px; height: 20px; stroke-width: 2.2; }
.person { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: var(--c, var(--c-social)); font-size: 16px; }
.count { text-align: right; font-variant-numeric: tabular-nums; }
.count b { display: block; font-size: 20px; line-height: 1; }
.count span { font-size: 12px; color: var(--muted); }
.count.soon b { color: var(--c-social); }

/* settings groups */
.group { background: var(--cell); border-radius: 14px; overflow: hidden; display: grid; }
.group > * { padding: 12px 16px; }
.group > * + * { border-top: 1px solid var(--sep); }
/* Buttons that are a row of their own: full width, so the separator above them is too. */
.group > button.link { justify-self: stretch; text-align: left; }
.group .toggle { min-height: 28px; }
.group select, .group input[type="time"] { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; }
.foot { font-size: 13px; color: var(--muted); margin: -6px 16px 0; }
.version { text-align: center; font-size: 12px; color: var(--muted); padding: 8px; user-select: none; cursor: default; }

/* guided steps */
.steps { display: grid; gap: 10px; counter-reset: s; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--fill); color: var(--muted); }
.step.now .n { background: var(--accent); color: var(--accent-ink); }
.step.ok .n { background: var(--c-salud); color: #fff; }
.step.ok b { color: var(--muted); font-weight: 500; }
.step p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

/* quick actions + onboarding */
.qa { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.qa button { border: 0; border-radius: 14px; background: var(--fill); color: var(--accent-text); font-weight: 600; padding: 14px 4px; font-size: 15px; cursor: pointer; }
.qa.two { grid-template-columns: 1fr 1fr; }
.qa .big { grid-column: 1 / -1; background: var(--c-salud); color: #fff; font-size: 17px; padding: 16px; }
.qhead { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; }
.qhead .em { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: color-mix(in srgb, var(--c) 18%, transparent); }
.onboard { position: fixed; inset: 0; z-index: 50; background: var(--group); display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-left, 0px)); }
.onboard .slide { width: min(420px, 100%); display: grid; gap: 16px; text-align: center; justify-items: center; }
.onboard .big { font-size: 64px; line-height: 1; }
.onboard h2 { margin: 0; font-family: var(--display); font-size: 30px; letter-spacing: -0.02em; }
.onboard p { margin: 0; color: var(--muted); font-size: 17px; }
.onboard.iv { place-items: start center; overflow-y: auto; }
.onboard.iv .slide { margin: auto 0; padding: 28px 0; }
.onboard .slide .group { width: 100%; text-align: left; }
.onboard .slide .chips { justify-content: center; } .onboard .slide .group .chips { justify-content: flex-start; }
.onboard .slide .reward { color: var(--ink); font-size: 18px; line-height: 1.45; }
.onboard .ivx { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer; }
.ivprog { width: 100%; display: grid; gap: 6px; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.ivprog .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.ivprog .bar i { height: 6px; border-radius: 999px; background: var(--fill); }
.ivprog .bar i.on { background: var(--accent); }
.pager { display: flex; gap: 6px; } .pager i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill); } .pager i.on { background: var(--accent); }

/* Pendi: ink outlines and offset "sticker" shadows by day; Penumbra cards (yellow top edge) by night. */
.list, .card, .sheet, .group { border: 2px solid var(--edge); }
.card, .group { border-top: 4px solid var(--accent); }
:root[data-theme="light"] .list { box-shadow: 4px 4px 0 var(--line); } :root[data-theme="light"] .card, :root[data-theme="light"] .group { box-shadow: 3px 3px 0 var(--line); }
.msg.me { border: 2px solid var(--edge); }
/* Status strip: what is in progress now (or what comes next), ticking by itself. */
.sbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; margin-bottom: 12px; padding: 12px 14px; text-align: left; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.sbar b { background: var(--fill); color: var(--accent-text); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; letter-spacing: .08em; white-space: nowrap; }
.sbar.run { background: color-mix(in srgb, var(--accent) 22%, var(--cell)); }
.sbar.run b { background: var(--accent); color: var(--accent-ink); }
.sbar.over b { background: var(--red); color: #fff; }
.sbar.none { color: var(--muted); cursor: default; }
.msg.ai { border: 2px solid var(--edge); border-radius: 4px 18px 18px 18px; background: var(--cell); }

/* Penumbra type: condensed uppercase titles, wide-tracked yellow labels. */
h1, .pane h2, .sheet h2, .onboard h2, .gate h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .005em; line-height: 1.02; }
h1 { font-size: 46px; }
.pane h2 { font-size: 34px; }
.sheet h2 { font-size: 28px; }
.onboard h2 { font-size: 38px; }
.gate h2 { font-size: 44px; }
.eyebrow, .section-label, .pane h3.sub { color: var(--accent-text); font-weight: 800; letter-spacing: .18em; font-size: 12px; }
.eyebrow::before { content: ""; display: inline-block; width: 22px; height: 3px; background: var(--accent); vertical-align: middle; margin-right: 8px; border-radius: 2px; }
:root[data-theme="light"] .eyebrow::before { box-shadow: 0 0 0 1px var(--line); }

/* Penumbra buttons: yellow pills with a glow; secondary ones are outlined. */
.btn { background: transparent; box-shadow: inset 0 0 0 2px var(--line); color: var(--accent-text); text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 14px; padding: 13px 22px; }
.btn.small { font-size: 12px; padding: 8px 14px; }
.btn.danger { box-shadow: inset 0 0 0 2px var(--red); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
:root[data-theme="light"] .btn.primary { box-shadow: inset 0 0 0 2px var(--line), var(--glow); }
.fab, .bigmic { box-shadow: var(--glow); }
.btn.primary:active, .fab:active { transform: scale(.97); box-shadow: none; }
.chip[aria-pressed="true"], .datef.on { box-shadow: 0 4px 14px rgba(242, 199, 68, .4); font-weight: 700; }
.qa button { font-weight: 800; }
.qa .big { background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); text-transform: uppercase; letter-spacing: .08em; }
.toggle input[type="checkbox"]:checked { background: var(--accent); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.wd.today .n { box-shadow: inset 0 0 0 2px var(--accent); }
.wd[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px rgba(242, 199, 68, .45); }
.item.now { background: color-mix(in srgb, var(--accent) 14%, var(--cell)); box-shadow: inset 4px 0 0 var(--accent); }

/* Round 2: day tools, tasks without a time, timeline, steps, celebrations, week review. */
.daytools { display: flex; gap: 8px; align-items: center; }
.seg2 { display: inline-flex; background: var(--fill); border-radius: 999px; padding: 3px; }
.seg2 button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.trayhead { display: flex; align-items: center; justify-content: space-between; margin: 0 4px -10px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
.trayhead .link { font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; }
.item.star .ti { color: var(--ink); }
.item.star { box-shadow: inset 4px 0 0 var(--accent); }
.item .prog { color: var(--muted); font-size: 13px; font-weight: 600; }
.tl { position: relative; }
.tl-h { position: absolute; left: 0; right: 0; border-top: 1px solid var(--sep); }
.tl-h span { position: absolute; top: -8px; left: 8px; font-size: 11px; color: var(--muted); background: var(--cell); padding-right: 4px; font-variant-numeric: tabular-nums; }
.tl-b { position: absolute; border: 0; border-left: 4px solid var(--c); border-radius: 10px; background: color-mix(in srgb, var(--c) 20%, var(--cell)); text-align: left; padding: 4px 8px; overflow: hidden; cursor: pointer; font-size: 12px; color: var(--muted); display: grid; align-content: start; }
.tl-b b { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-b.short span { display: none; }
.tl-b.short { padding-top: 2px; }
.tl-b.done { opacity: .5; } .tl-b.done b { text-decoration: line-through; }
.tl-b.star { box-shadow: 0 0 0 2px var(--accent); }
.tl-free { position: absolute; left: 66px; right: 6px; border: 2px dashed var(--sep); border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; display: grid; place-items: center; overflow: hidden; }
.tl-now { position: absolute; left: 60px; right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
.tl-now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.steps-list { display: grid; gap: 2px; }
.steps-list > summary { list-style: none; text-align: center; margin-bottom: 6px; }
.steps-list > summary::-webkit-details-marker { display: none; }
.steps-list .step { display: flex; align-items: center; gap: 6px; }
.steps-list label { flex: 1; display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; min-width: 0; }
.steps-list input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.steps-list .done span { text-decoration: line-through; color: var(--muted); }
.steps-list .sdel { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; flex: none; }
.steps-list form { display: flex; gap: 8px; margin-top: 6px; }
.steps-list .regen { justify-self: start; font-size: 15px; padding: 10px 0; }
/* Every sheet has a round ✕ at the top right: it closes without changing anything. */
.sheet > .xclose { position: sticky; top: 0; grid-row: 1; grid-column: 1; justify-self: end; z-index: 3; width: 38px; height: 38px; margin: 0 -8px -38px 0; border-radius: 50%; border: 0; background: var(--fill); color: var(--ink); font-size: 17px; font-weight: 700; line-height: 1; display: grid; place-items: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.sheet > .grabber { grid-row: 1; grid-column: 1; }
.sheet > h2:first-of-type, .sheet > .qhead { padding-right: 40px; }
.btn.huge { width: 100%; font-size: 17px; padding: 17px 22px; }
.sheet select { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; }
.toast .undo { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
.cheerwrap { position: fixed; left: 0; right: 0; top: 34%; z-index: 61; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; transition: transform .25s, opacity .25s; }
.cheerwrap.out { opacity: 0; }
.cheer { position: relative; overflow: hidden; pointer-events: auto; touch-action: none; cursor: grab; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 18px; line-height: 1.3; padding: 16px 22px 20px; border-radius: 20px; box-shadow: var(--glow); text-align: center; width: max-content; max-width: min(340px, 88vw); animation: cheer .5s ease both; }
.cheer.big { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: 30px; }
.cheer .life { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--accent); transform-origin: left; animation: life var(--life, 5s) linear forwards; }
.hold .life { animation-play-state: paused; }
@keyframes cheer { 0% { opacity: 0; transform: scale(.7); } 60% { opacity: 1; transform: scale(1.04); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .cheer { animation: none; } }
.weekstat { display: flex; align-items: baseline; gap: 10px; }
.weekstat b { font-family: var(--display); font-size: 48px; font-weight: 400; line-height: 1; color: var(--accent-text); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
.bars > div { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.bars .v { width: 100%; max-width: 30px; min-height: 4px; background: var(--fill); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
.bars .v i { display: block; width: 100%; background: var(--accent); }

/* Round 2 polish: breathing room, free time that stands out, undo bar at the bottom, compact task menu, clearer light mode. */
#dayList { display: grid; gap: 14px; }
.trayhead { margin: 6px 4px -4px; }
:root { --free: #17876F; }
:root[data-theme="dark"] { --free: #5BD4A0; }
.tl-free { left: 70px; right: 10px; border-color: color-mix(in srgb, var(--free) 45%, transparent); background: color-mix(in srgb, var(--free) 8%, transparent); color: var(--free); font-size: 15px; font-weight: 800; }
.tl-free b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; margin-right: 6px; }
@keyframes slideL { from { opacity: .3; transform: translateX(40px); } }
@keyframes slideR { from { opacity: .3; transform: translateX(-40px); } }
#dayList.slide-l { animation: slideL .22s ease-out; }
#dayList.slide-r { animation: slideR .22s ease-out; }
/* With a sheet open, the bubbles move to the top so they never cover its buttons. */
#sheet:not([hidden]) ~ .snacks { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
.snacks { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(420px, calc(100vw - 24px)); z-index: 62; pointer-events: none; }
.snack { pointer-events: auto; position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 12px 12px 14px 16px; border-radius: 18px; background: var(--cell); color: var(--ink); box-shadow: var(--shadow); touch-action: none; transition: transform .2s, opacity .2s; }
.snack b { flex: 1; font-size: 15px; line-height: 1.3; white-space: pre-line; }
.snack .undo { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 14px; cursor: pointer; flex: none; }
.snack .life { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--accent); transform-origin: left; animation: life var(--life, 6s) linear forwards; }
.snack.hold .life { animation-play-state: paused; }
.snack.out { opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .snack { animation: rise .35s cubic-bezier(.2, .9, .25, 1.1); } @keyframes rise { from { transform: translateY(140%); opacity: .2; } } }
@media (max-width: 860px) { .snacks { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); } }
.cheer { background: var(--ink); color: var(--bg); border: 2px solid var(--accent); box-shadow: 6px 6px 0 var(--accent); }
.more > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 16px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-text); background: var(--fill); }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: "▾"; transition: transform .2s; }
.more[open] > summary::after { transform: rotate(180deg); }
.more[open] > .actions { margin-top: 10px; }
:root[data-theme="light"] .snack, :root[data-theme="light"] .toast { background: #fff; border: 1.5px solid var(--ink); }
:root[data-theme="light"] .tabbar { background: #FFF1BF; border-top: 1.5px solid var(--ink); -webkit-backdrop-filter: none; backdrop-filter: none; }
:root[data-theme="light"] .tabbar button { color: #4A463B; }
:root[data-theme="light"] .tabbar button[aria-selected="true"] { color: var(--ink); font-weight: 800; }
:root[data-theme="light"] .tabbar button[aria-selected="true"] svg { background: var(--accent); border-radius: 999px; box-shadow: 0 0 0 1.5px var(--ink); }
.tabbar button svg { width: 52px; height: 28px; padding: 2px 14px; }

/* Round 2 use fixes: stop square while recording, keyboard-aware chat, sheets you can pull down, pick suggestions. */
.mic.rec svg, .bigmic.rec svg { display: none; }
.mic.rec::after, .bigmic.rec::after { content: ""; width: 14px; height: 14px; border-radius: 3px; background: #fff; }
.bigmic.rec::after { width: 30px; height: 30px; border-radius: 6px; }
#chatSend.stop { background: var(--red); color: #fff; box-shadow: none; }
html.kb .tabbar { display: none; }
@media (max-width: 860px) {
  html.kb .app { padding-bottom: 0; }
  html.kb .side { top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); }
}
.sheet.pulling { transition: none !important; animation: none !important; }
.sheet.letgo { transition: transform .22s ease; }
.card.pick { cursor: pointer; position: relative; }
.card.pick.sel { box-shadow: inset 0 0 0 2px var(--accent), var(--glow); }
.card.pick .tick { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--sep); display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--accent-ink); }
.card.pick.sel .tick { background: var(--accent); box-shadow: none; }
.card.pick h3 { padding-right: 34px; }
.qrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qrow input[type="time"] { border: 0; background: var(--fill); border-radius: 10px; padding: 8px 12px; font-size: 16px; min-width: 120px; text-align: center; }

/* Organize: the mic sits inside the writing box, like in the chat. */
.dumpbox { position: relative; }
.dumpbox textarea { min-height: 150px; padding-right: 70px; padding-bottom: 16px; resize: vertical; }
.dumpbox .mic { position: absolute; right: 12px; bottom: 12px; width: 52px; height: 52px; background: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.dumpbox .mic.rec { background: var(--red); color: #fff; box-shadow: none; }
.dumpbox:has(.mic.rec) textarea { box-shadow: inset 0 0 0 2px var(--red); }
.dumpbox + .miclabel { margin-top: -8px; text-align: left; padding-left: 4px; font-size: 13px; }

/* Bichos: a word on a tilted yellow highlighter block. */
.hl { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 0 .2em; transform: skew(-8deg); box-shadow: 4px 4px 0 var(--ink); }
</style>

<body>
<div id="gate" class="gate" hidden></div>

<div id="app" class="app" hidden>
  <section class="cal" data-i18n-aria="agenda">
    <div class="cal-inner">
      <div class="top">
        <button class="link" id="todayBtn" data-i18n="today">Hoy</button>
        <div class="spacer"></div>
        <button class="chev" id="searchBtn" data-i18n-aria="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
        <button class="link" id="viewBtn" aria-pressed="false">Mes</button>
        <button class="chev" id="prevBtn" aria-label=""><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

      </div>
      <div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div class="summary" id="summary"></div></div>
      <div class="week" id="week"></div>
      <div id="dayList"></div>
    </div>
  </section>

  <aside class="side" id="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="organize" aria-selected="true" data-i18n="tabOrganize">Organizar</button>
        <button class="tab" role="tab" data-tab="chat" aria-selected="false" data-i18n="tabChat">Chat</button>
        <button class="tab" role="tab" data-tab="bdays" aria-selected="false" data-i18n="tabBdays">Cumpleaños</button>
        <button class="tab" role="tab" data-tab="settings" aria-selected="false" data-i18n="tabSettings">Ajustes</button>
      </div>

      <div class="pane" data-pane="organize">
        <h2 data-i18n="orgTitle">Vacía tu cabeza</h2>
        <p class="muted" data-i18n="orgIntro"></p>
        <div class="dumpbox">
          <textarea id="dump" class="field" data-i18n-ph="dumpPh"></textarea>
          <button type="button" class="mic" data-mic="dump" data-label="dumpMicLabel" data-i18n-aria="dictate"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
        </div>
        <div class="miclabel" id="dumpMicLabel" data-i18n="tapTalk"></div>
        <div class="seg" id="dumpDay" role="group" data-i18n-aria="whichDay"></div>
        <button id="organize" class="btn primary" data-i18n="organizeBtn"></button>
        <div id="dumpStatus" class="status" role="status"></div>
        <div id="proposals" style="display:grid;gap:10px"></div>
        <div class="row" id="proposalActions" hidden>
          <button id="scheduleAll" class="btn primary"></button>
          <button id="discard" class="btn"></button>
        </div>
        <div id="overdue" style="display:grid;gap:8px"></div>
      </div>

      <div class="pane" data-pane="chat" hidden>
        <h2 data-i18n="chatTitle"></h2>
        <div class="chips" id="chatChips"></div>
        <div class="chatscroll" id="chatScroll"><div id="chatlog" class="chatlog" aria-live="polite"></div></div>
        <form id="chatForm" class="row">

    const prev = clear(); notice(tr(msg), () => { restore(prev); syncSettings(); });
  } }, tr("rtClear"));
  function paintRoutine(force) {
    const a = document.activeElement;
    if (!force && a && a.tagName === "INPUT" && a.type === "time" && $("routineGroup").contains(a)) return;
    const r = rt(), w = { days: [1, 2, 3, 4, 5], kind: "fixed", ...(r.work || {}) }, sl = r.sleep || {};
    const f = formPicker(state.settings.name, state.settings.form, (x) => { saveSettings({ form: x }); paintRoutine(true); });
    $("formBox").hidden = !f; $("formBox").replaceChildren(...(f ? [el("span", {}, tr("formL")), f] : []));
    const saveW = (patch) => { saveRoutine({ work: { ...w, ...patch } }); paintRoutine(true); };
    $("workBox").replaceChildren(...[el("b", {}, tr("workH")),
      el("div", { class: "chips" }, ["fixed", "shifts", "none"].map((k) => el("button", { type: "button", class: "chip", "aria-pressed": String(w.kind === k), onclick: () => saveW({ kind: k }) }, tr("wk_" + k)))),
      ...(w.kind === "none" ? [el("span", { class: "muted" }, tr("q2bNone"))] : [
        qrow(tr("q2In"), timeIn(w.from, (v) => saveW({ from: v }))), qrow(tr("q2Out"), timeIn(w.to, (v) => saveW({ to: v }))),
        switchRow(tr("q2Lunch"), !!w.lunch, (on) => saveW({ lunch: on ? "13:00" : "" })),
        w.lunch ? qrow(tr("q2LunchAt"), timeIn(w.lunch, (v) => saveW({ lunch: v }))) : null,
        el("span", { class: "muted" }, tr("q2bDays")), dayChips(w.days, (x) => saveW({ days: w.days.includes(x) ? w.days.filter((y) => y !== x) : [...w.days, x] })),
        w.from || w.to ? clearBtn(() => { const prev = clone(rt().work || null); saveW({ from: "", to: "", lunch: "" }); return prev; }, "rtWorkGone", (prev) => saveRoutine({ work: prev })) : null])].filter(Boolean));
    const saveS = (patch) => { saveRoutine({ sleep: { ...sl, ...patch } }); paintRoutine(true); };
    const we = sl.we || null;
    $("sleepBox").replaceChildren(...[el("b", {}, tr("sleepH")),
      qrow(tr("stUp"), timeIn(sl.up, (v) => saveS({ up: v }))), qrow(tr("stBed"), timeIn(sl.bed, (v) => saveS({ bed: v }))),
      switchRow(tr("q3We"), !!we, (on) => saveS({ we: on ? { up: sl.up || "", bed: sl.bed || "" } : null })),
      ...(we ? [el("span", { class: "muted" }, tr("q3WeH")), qrow(tr("stUp"), timeIn(we.up, (v) => saveS({ we: { ...we, up: v } }))), qrow(tr("stBed"), timeIn(we.bed, (v) => saveS({ we: { ...we, bed: v } })))] : []),
      sl.up || sl.bed ? clearBtn(() => { const prev = clone(rt().sleep || null); saveRoutine({ sleep: null }); paintRoutine(true); return prev; }, "rtSleepGone", (prev) => saveRoutine({ sleep: prev })) : null].filter(Boolean));
    const fg = r.forget || [];
    $("forgetBox").replaceChildren(el("b", {}, tr("forgetL")), forgetChips(fg, (k) => { saveRoutine({ forget: fg.includes(k) ? fg.filter((x) => x !== k) : [...fg, k] }); paintRoutine(true); }));
    // The same chips as in the welcome.
    $("energyBox").replaceChildren(el("b", {}, tr("ob2Title")), el("div", { class: "chips" }, ENERGY.map(([e, k]) => el("button", { type: "button", class: "chip", "aria-pressed": String(energy() === e), onclick: () => { saveSettings({ energy: e }); paintRoutine(true); } }, tr(k)))));
    $("rtRedo").textContent = tr(r.done ? "rtRedo" : "rtCardTitle");
  }

  // ---------- first-time welcome ----------
  // The welcome ends with Pendi's interview, right after the reminders step (tested or left for later).
  function onboarding() {
    const box = $("onboard"); let i = 0;
    const pager = () => el("div", { class: "pager" }, [0, 1, 2].map((j) => el("i", { class: j === Math.min(i, 2) ? "on" : "" })));
    const slides = [
      () => [el("div", { class: "big" }, "👋"), el("h2", {}, tr("ob1Title")),
        el("p", {}, tr("ob1Text")),
        el("button", { class: "btn primary", onclick: () => { i = 1; paint(); } }, tr("start"))],
      () => [el("div", { class: "big" }, "⚡"), el("h2", {}, tr("ob2Title")),
        el("p", {}, tr("ob2Text")),
        el("div", { class: "chips", style: "justify-content:center" }, ["mañana", "tarde", "noche"].map((e) => el("button", { class: "chip", "aria-pressed": String(energy() === e), onclick: () => { saveSettings({ energy: e }); syncSettings(); i = 2; paint(); } }, tr(e === "mañana" ? "morningE" : e === "tarde" ? "afternoonE" : "nightE"))))],
      () => [el("div", { class: "big" }, "🔔"), el("h2", {}, tr("ob3Title")),
        el("p", {}, tr("ob3Text", { x: remindText() })),
        el("button", { class: "btn primary", onclick: () => { i = 3; paint(); } }, tr("enableNotifs")),
        el("button", { class: "link", onclick: later }, tr("probeLater"))],
      // The reminders step ends when a real test reminder is tapped on this phone. It can be skipped, and then Ajustes keeps
      // saying the reminders are not confirmed.
      () => {
        const area = el("div", { style: "display:grid;gap:12px;width:100%" });
        probeFlow(area, { ask: true, later, onDone: () => area.append(el("button", { class: "btn primary", style: "justify-self:center", onclick: () => interview({ welcome: true }) }, tr("start"))) });
        return [el("div", { class: "big" }, "🔔"), el("h2", {}, tr("ob3Title")), area];
      },
    ];
    function later() { ls.set("pushProof", { ok: false, at: Date.now() }); renderPush(); interview({ welcome: true }); }
    const paint = () => box.replaceChildren(el("div", { class: "slide" }, ...slides[i](), pager()));
    box.hidden = false; paint();
  }

  // ---------- tabs ----------
  function showTab(name) {
    if (dictating) { const d = dictating; dictating = null; d.stop(); }
    document.querySelectorAll("[data-pane]").forEach((p) => (p.hidden = p.dataset.pane !== name));
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    document.querySelectorAll(".tabbar button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    if (isPhone()) $("side").hidden = name === "cal";
    else if (name === "cal") return showTab("organize");
    $("fab").hidden = isPhone() && (name === "chat" || name === "settings");
    if (name === "chat") { const sc = $("chatScroll"); sc.scrollTop = sc.scrollHeight; }
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  // ---------- phone gestures ----------
  // The keyboard: the open pane shrinks to the space above it (the tab bar hides), so the last messages stay in view.
  const vv = window.visualViewport;
  if (vv) {
    let tallest = vv.height;
    const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !/^(checkbox|radio|button|submit|date|time|file)$/.test(a.type))); };
    const fit = () => {
      tallest = Math.max(tallest, vv.height);
      const kb = typing() && (tallest - vv.height > 120 || innerHeight - vv.height > 120);
      const root = document.documentElement;
      root.classList.toggle("kb", kb);
      root.style.setProperty("--vvh", vv.height + "px"); root.style.setProperty("--vvt", vv.offsetTop + "px");
      if (kb) { const sc = $("chatScroll"); if (sc && !$("side").hidden) sc.scrollTop = sc.scrollHeight; }
    };
    vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit);
    addEventListener("orientationchange", () => { tallest = 0; setTimeout(fit, 300); });
    document.addEventListener("focusin", () => setTimeout(fit, 50)); document.addEventListener("focusout", () => setTimeout(fit, 50));
  }
  // Installed app: no pinch zoom (iPhone ignores the page setting, so the gesture is blocked here too).
  ["gesturestart", "gesturechange"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
  // Sheets from the bottom: pull them down to close.
  (() => {
    const bg = $("sheet"); let y0 = 0, x0 = 0, dy = 0, sh = null, pulling = false;
    bg.addEventListener("touchstart", (e) => {
      sh = e.target.closest(".sheet"); pulling = false; dy = 0;
      if (!sh || e.touches.length > 1 || e.target.closest("input, select, textarea, .steps-list")) { sh = null; return; }
      y0 = e.touches[0].clientY; x0 = e.touches[0].clientX;
    }, { passive: true });
    bg.addEventListener("touchmove", (e) => {
      if (!sh) return;
      const d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
      if (!pulling) { if (d > 8 && d > Math.abs(dx) && sh.scrollTop <= 0) { pulling = true; sh.classList.add("pulling"); } else if (Math.abs(d) > 8 || Math.abs(dx) > 8) { sh = null; return; } else return; }
      dy = Math.max(0, d); sh.style.transform = `translateY(${dy}px)`; e.preventDefault();
    }, { passive: false });
    const end = () => {
      if (!sh || !pulling) { sh = null; return; }
      const s = sh; sh = null; s.classList.remove("pulling"); s.classList.add("letgo");
      if (dy > Math.min(140, s.offsetHeight / 4)) { s.style.transform = "translateY(100%)"; setTimeout(closeSheet, 200); }
      else { s.style.transform = ""; setTimeout(() => s.classList.remove("letgo"), 250); }
    };
    bg.addEventListener("touchend", end); bg.addEventListener("touchcancel", end);
  })();
  // Swipe sideways to go to the next or previous tab (phones). Task rows keep their own swipe.
  // In the calendar it changes the day (or the month); there the tab bar is where you swipe to change tabs.
  (() => {
    const order = ["cal", "organize", "chat", "bdays", "settings"];
    let x0 = 0, y0 = 0, t0 = 0, ok = false, onBar = false;
    $("app").addEventListener("touchstart", (e) => {
      const t = e.target;
      ok = isPhone() && e.touches.length === 1 && !document.documentElement.classList.contains("kb") && !t.closest(".swipe, input, select, textarea, .snack, .seg2");
      onBar = !!t.closest(".tabbar");
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    $("app").addEventListener("touchend", (e) => {
      if (!ok || !$("sheet").hidden) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - t0 > 700) return;
      const cur = document.querySelector(".tabbar button[aria-selected='true']"), i = order.indexOf(cur ? cur.dataset.tab : "cal");
      if (i <= 0 && !onBar) {
        $(dx < 0 ? "nextBtn" : "prevBtn").click();
        const m = $("dayList"); m.classList.remove("slide-l", "slide-r"); void m.offsetWidth; m.classList.add(dx < 0 ? "slide-l" : "slide-r");
        return;
      }
      const next = order[i + (dx < 0 ? 1 : -1)];
      if (next) showTab(next);
    }, { passive: true });
  })();


  function render() { renderCal(); renderOverdue(); renderBdays(); }

  // ---------- gate (password / setup) ----------
  function showGate(kind, msg) {
    const g = $("gate"); g.hidden = false; $("app").hidden = true; g.replaceChildren();
    if (kind === "nopass") {
      g.append(el("div", { class: "card" }, el("h2", {}, tr("missingStep")),
        el("p", {}, tr("missingStepText")),
        el("p", { class: "muted" }, tr("missingStepNote"))));
      return;
    }
    const inp = el("input", { class: "field", type: "password", placeholder: tr("password"), autocomplete: "current-password" });
    const st = el("div", { class: "status err" }, msg || "");
    g.append(el("form", { class: "card", onsubmit: async (e) => { e.preventDefault(); pass = inp.value; ls.set("pass", pass); await boot(); } },
      el("img", { src: "/icon-192.png", alt: "" }), el("h2", { style: "margin:0" }, el("span", { class: "hl" }, "Pendi")),
      el("p", { class: "muted" }, tr("enterPw")), inp, el("button", { class: "btn primary" }, tr("enter")), st));
    inp.focus();
  }

  async function boot() {
    try { state.status = await call("/api/status"); }
    catch { state.status = { password: true, authed: true, offline: true }; }
    if (!state.status.password) return showGate("nopass");
    if (!state.status.authed) return showGate("login", pass ? tr("wrongPw") : "");
    $("gate").hidden = true; $("app").hidden = false;
    await loadData();
    syncSettings();
    render(); renderChat(); renderSetup(); renderPush();
    showTab(isPhone() ? "cal" : "organize");
    const wasOnboarded = ls.get("onboarded", false);
    const fromUrl = handleUrl();
    if (bdayNudges() && !fromUrl) showTab("chat");
    scrollToNow(); checkReminders();
    await probeCache();
    if ("serviceWorker" in navigator) navigator.serviceWorker.ready.then((r) => r.active && r.active.postMessage({ hello: true, standalone })).catch(() => {});
    if (!ls.get("onboarded", false) && !fromUrl) onboarding();
    // The test reminder of the welcome was tapped and opened a new window: the welcome goes on with the interview.
    else if (!wasOnboarded && ls.get("onboarded", false) && !state.settings.routine) interview({ welcome: true });
    else if (!fromUrl) nextHow();
  }

  // ---------- wiring ----------
  const shiftMonth = (n) => { const a = state.anchor; const x = new Date(a.getFullYear(), a.getMonth() + n, 1); x.setDate(Math.min(a.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
  $("todayBtn").onclick = () => { state.anchor = new Date(); render(); scrollToNow(); };
  $("prevBtn").onclick = () => { state.anchor = monthView ? shiftMonth(-1) : addDays(state.anchor, -1); render(); };
  $("nextBtn").onclick = () => { state.anchor = monthView ? shiftMonth(1) : addDays(state.anchor, 1); render(); };
  $("viewBtn").onclick = () => { monthView = !monthView; renderCal(); };
  $("fab").onclick = openAdd;
  daySeg($("dumpDay"), dumpDate);
  const bDate = el("input", { id: "bDate", "aria-label": tr("bdayDate") });
  $("bDateBox").append(dateField(bDate, { block: true, placeholder: tr("bdayDate") }));
  $("bdAdd").onclick = () => { $("bdForm").hidden = !$("bdForm").hidden; if (!$("bdForm").hidden) $("bName").focus(); };
  $("bdCancel").onclick = () => { $("bdForm").reset(); $("bdForm").hidden = true; document.querySelectorAll(".datef").forEach((d) => d.refresh && d.refresh()); };
  $("datefmt").onchange = () => { saveSettings({ datefmt: $("datefmt").value }); syncSettings(); render(); };
  $("clock").onchange = () => { saveSettings({ clock: $("clock").value }); syncSettings(); render(); };
  $("theme").onchange = () => { saveSettings({ theme: $("theme").value }); applyTheme(); };
  // Changing the language repaints every screen; the server keeps it (uiLang) for the notifications it sends.
  for (const [k, name] of Object.entries(LANGS)) $("lang").append(el("option", { value: k }, name));
  $("lang").onchange = () => {
    saveSettings({ lang: $("lang").value }); setLang(); saveSettings({ uiLang: lang });
    applyLang(); syncSettings(); render(); renderSetup(); renderPush(); renderProposals(); renderChat();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  ["briefMOn", "briefM", "briefEOn", "briefE", "briefWOn"].forEach((x) => { $(x).onchange = saveBrief; });
  $("seeWeek").onclick = openWeek;
  $("searchBtn").onclick = openSearch;
  $("backupBtn").onclick = backup;
  $("restoreBtn").onclick = () => $("restoreFile").click();
  $("restoreFile").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) restore(f); };
  $("quietOn").onchange = saveQuiet; $("quietFrom").onchange = saveQuiet; $("quietTo").onchange = saveQuiet;
  // Hidden admin mode: tap the version 5 times.
  let taps = [];
  $("version").onclick = () => {
    taps = [...taps.filter((x) => Date.now() - x < 3000), Date.now()];
    if (taps.length >= 5) { taps = []; ls.set("admin", !ls.get("admin", false)); renderSetup(); notice(tr(ls.get("admin", false) ? "adminOn" : "adminOff")); }
  };
  // A recording in progress is finished (and written) before organizing.
  $("organize").onclick = async () => { if (dictating) { const d = dictating; dictating = null; await d.stop(); } organize(); };
  $("scheduleAll").onclick = scheduleAll;
  $("discard").onclick = () => { const left = (state.proposals || []).filter((p) => !p.sel); state.proposals = left.length && left.length < state.proposals.length ? left : null; renderProposals(); $("dumpStatus").textContent = ""; };
  // Send stops a recording first (and sends what was said); while the AI thinks, the same button stops it.
  $("chatForm").onsubmit = async (e) => {
    e.preventDefault();
    if (chatAbort) { chatAbort.abort(); return; }
    if (dictating) { const d = dictating; dictating = null; await d.stop(); }
    const v = $("chatIn").value; $("chatIn").value = ""; sendChat(v);
  };
  $("myName").onchange = () => { const v = $("myName").value.trim().slice(0, 40); $("myName").value = v; if (v !== (state.settings.name || "")) { saveSettings({ name: v }); paintRoutine(true); notice(tr("nameSaved")); } };
  $("myName").oninput = () => { const f = formPicker($("myName").value, state.settings.form, () => {}); if (f) $("formBox").querySelectorAll(".lvcard b").forEach((b, j) => { b.textContent = f.children[j].textContent; }); };
  $("rtRedo").onclick = () => interview();
  $("sound").onchange = () => saveSettings({ sound: $("sound").checked });
  $("testToast").onclick = () => toast({ title: tr("ex1Title"), time: "10:00", cat: "creativo", tip: tr("ex1Tip") }, 30, true);
  $("logout").onclick = () => showSheet(el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": tr("logoutTitle") }, el("div", { class: "grabber" }),
    el("h2", {}, tr("logoutTitle")), el("p", {}, tr("logoutQ")),
    el("div", { class: "row" },
      el("button", { class: "btn primary", style: "background:var(--red);border-color:var(--red)", onclick: () => { ls.set("pass", ""); pass = ""; location.reload(); } }, tr("logoutYes")),
      el("button", { class: "btn", onclick: closeSheet }, tr("cancel")))));
  $("bdForm").onsubmit = (e) => {
    e.preventDefault();
    if (!bDate.value) { notice(tr("chooseBdayDate")); return; }
    const [y, m, d] = bDate.value.split("-").map(Number);
    // The year is kept only when it looks like a birth year, so "cumple 30" can be shown.
    put({ id: uid("b"), kind: "bday", name: $("bName").value.trim(), month: m, day: d, year: y < new Date().getFullYear() ? y : null, notes: $("bNotes").value.trim() });
    e.target.reset(); e.target.hidden = true; document.querySelectorAll(".datef").forEach((x) => x.refresh && x.refresh());
  };
  matchMedia("(max-width: 860px)").addEventListener("change", () => showTab(isPhone() ? "cal" : "organize"));

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  setInterval(checkReminders, 20000);
  setInterval(() => { if (!document.hidden && bar && bar.isConnected) paintBar(); }, 1000);
  setInterval(() => { if (expandSeries()) render(); else if (!document.hidden) renderCal(); }, 60000);
  applyLang();
  boot();
})();
